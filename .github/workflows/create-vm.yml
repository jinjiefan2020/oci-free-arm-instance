name: Try to Create OCI VM

on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时触发一次，job 内部循环每10分钟重试
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  create-oci-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install and configure OCI CLI
        run: |
          pip install oci-cli

          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=$HOME/.oci/oci_api_key.pem
          region=${{ env.OCI_CLI_REGION }}
          EOF

          printf '%s' "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

      - name: Try to create VM (每10分钟重试，最多30次≈5小时)
        id: create_vm
        run: |
          MAX_ATTEMPTS=30
          INTERVAL=600
          VM_CREATED=false
          LAST_LOG=""

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Attempt $i / $MAX_ATTEMPTS ==="

            LAST_LOG=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 200 2>&1 || true)

            if echo "$LAST_LOG" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "Success! VM is PROVISIONING."
              VM_CREATED=true
              break
            fi

            # 打印关键错误信息便于日志排查
            echo "No capacity yet. OCI response snippet:"
            echo "$LAST_LOG" | grep -iE '"message"|"code"|"status"' | head -3 || echo "$LAST_LOG" | head -3

            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "Waiting ${INTERVAL}s before next attempt..."
              sleep $INTERVAL
            fi
          done

          {
            echo "vm_created=$VM_CREATED"
            echo "log_data<<LOGEOF"
            echo "$LAST_LOG"
            echo "LOGEOF"
          } >> "$GITHUB_OUTPUT"

          # 没抢到不是 workflow 错误，始终 exit 0
          exit 0

      - name: Notify Discord — VM Created (Success)
        if: steps.create_vm.outputs.vm_created == 'true'
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI A1.Flex VM Created!"
          status: success
          color: 0x28a745
          description: |
            VM is now **PROVISIONING**.
            ```json
            ${{ steps.create_vm.outputs.log_data }}
            ```

      - name: Notify Discord — No Capacity (Still Waiting)
        if: steps.create_vm.outputs.vm_created == 'false'
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI VM: No capacity after 30 attempts"
          status: failure
          color: 0xffc107
          description: |
            30次尝试Montreal（约5小时）均无可用容量，将在下次触发时继续。
            **Last OCI response:**
            ```json
            ${{ steps.create_vm.outputs.log_data }}
            ```
