name: Try to Create OCI VM

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: oci-a1-free-tier-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  VM_NAME: coolify-vm

jobs:
  create-oci-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      # ... (你之前的所有步骤保持不变) ...

  # 新增：专门处理被取消的通知
  notify-cancel:
    runs-on: ubuntu-latest
    needs: create-oci-vm
    if: cancelled()
    steps:
      - name: Notify Discord — Job Cancelled
        uses: nobrayner/discord-webhook@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "⚠️ OCI VM Scrapper Cancelled"
          color-cancelled: '0x42daf5'
          description: |
            这个工作流被新的定时调度取消了（这是正常的换班行为）。
            **新任务会自动继续运行，不会丢失进度。**
            ```
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            Cancelled at: ${{ github.event.workflow_run.cancelled_at }}
            ```

      - name: Notify Sarisia — Job Cancelled (备选)
        if: false  # 如果上面那个不行，用这个替代
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "⚠️ OCI VM Scrapper Cancelled"
          status: failure
          color: 0x42daf5
          description: |
            工作流被 concurrency 规则取消了（正常换班）。新任务会继续。
